<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>CMG Budget Control — Workflow Dependency</title>
<style>
  @font-face{font-family:"Kanit";src:url("fonts/Kanit-600.ttf") format("truetype");font-weight:600;font-display:block}
  @font-face{font-family:"Sarabun";src:url("fonts/Sarabun-400.ttf") format("truetype");font-weight:400;font-display:block}
  @font-face{font-family:"Sarabun";src:url("fonts/Sarabun-700.ttf") format("truetype");font-weight:700;font-display:block}
  :root{ --ink:#1c2420; --body:#3d4741; --muted:#67716b; --line:#c6cec8; --accent:#0e6e5a; --reject:#c0392b; --paper:#f5f6f3; --card:#ffffff }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9ebe7;font-family:"Sarabun","Leelawadee UI",Tahoma,sans-serif;color:var(--ink)}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--paper);padding:40px 60px 24px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
  h1{font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--accent)}
  .meta{text-align:right;color:var(--muted);font-size:13px;line-height:1.5}
  .meta b{color:var(--ink)}
  svg{display:block}
  svg text{font-family:"Sarabun","Leelawadee UI",Tahoma,sans-serif}
  .hdr{font-weight:700;font-size:16px;fill:var(--ink)}
  .lbl{font-size:12px;fill:var(--muted)}
  .st{font-weight:700;font-size:17px;fill:var(--ink)}
  .edge{font-size:12.5px;fill:var(--muted)}
  .rej{font-size:13.5px;fill:var(--reject)}
  .note{font-size:12.5px;fill:var(--muted)}
  .box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
  .fin{stroke:var(--accent);stroke-width:2}
  .flow{stroke:#4a554f;fill:none;stroke-width:1.4}
  .rjp{stroke:var(--reject);fill:none;stroke-width:1.4;stroke-dasharray:5 4}
  .fld{font-size:13px;fill:var(--body)}
  .fk{font-weight:700;fill:var(--accent)}
  .ent{font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif;font-weight:600;font-size:15.5px;fill:#fff}
  .col{font-size:11.5px;fill:#cfe4de}
  .key{font-size:11.5px;fill:var(--accent);font-weight:700}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .rise{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    .slide.onstage .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
    .slide.onstage .rise:nth-child(2){animation-delay:.1s}
  }
</style>
</head>
